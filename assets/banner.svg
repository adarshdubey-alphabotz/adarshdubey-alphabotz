<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Neon Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#7000FF" />
      <stop offset="70%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#00F0FF" />
      <animate attributeName="x1" from="0%" to="100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" from="100%" to="200%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Cyber Cyan Gradient -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Purple Glow -->
    <radialGradient id="orb-purple" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Orb -->
    <radialGradient id="orb-cyan" cx="15%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
    .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .pulse { animation: pulse-glow 3s infinite ease-in-out; }
  </style>

  <!-- Base Card Background with Cyber Border -->
  <rect x="5" y="5" width="940" height="350" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Background Orbs -->
  <rect x="5" y="5" width="940" height="350" rx="16" fill="url(#orb-purple)" />
  <rect x="5" y="5" width="940" height="350" rx="16" fill="url(#orb-cyan)" />

  <!-- Grid overlay -->
  <rect x="5" y="5" width="940" height="350" rx="16" fill="url(#cyber-grid)" />

  <!-- Cyber Border Accents -->
  <!-- Top-left corner bracket -->
  <path d="M 20 45 L 20 20 L 45 20" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#soft-glow)" />
  <!-- Top-right corner bracket -->
  <path d="M 905 20 L 930 20 L 930 45" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#soft-glow)" />
  <!-- Bottom-left corner bracket -->
  <path d="M 20 315 L 20 340 L 45 340" fill="none" stroke="#FF007F" stroke-width="2.5" filter="url(#soft-glow)" />
  <!-- Bottom-right corner bracket -->
  <path d="M 905 340 L 930 340 L 930 315" fill="none" stroke="#00F0FF" stroke-width="2.5" filter="url(#soft-glow)" />

  <!-- Top HUD Bar -->
  <g class="mono" font-size="11" letter-spacing="1.5">
    <text x="45" y="42" fill="#00F0FF" font-weight="600" opacity="0.9">⚡ PROTOCOL: ALPHABOTZ_CORE_V2.6</text>
    <circle cx="810" cy="38" r="4" fill="#00FF66" filter="url(#soft-glow)" />
    <text x="822" y="42" fill="#A7F3D0" font-weight="600">LIVE // OPERATIONAL</text>
  </g>

  <!-- Top Divider Line -->
  <line x1="45" y1="55" x2="905" y2="55" stroke="#334155" stroke-width="1" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Main Hero Title -->
  <g class="display">
    <text x="475" y="145" text-anchor="middle" font-size="52" font-weight="900" letter-spacing="4" fill="url(#title-grad)" filter="url(#glow)">
      ADARSH DUBEY
    </text>
  </g>

  <!-- Subtitle / Roles Badge Bar -->
  <g class="mono" font-size="13" font-weight="600" letter-spacing="1.5">
    <!-- Tag 1: Telegram Bots -->
    <rect x="110" y="175" width="225" height="30" rx="8" fill="#162032" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4" />
    <text x="222" y="195" text-anchor="middle" fill="#00F0FF">🤖 TELEGRAM ARCHITECT</text>

    <!-- Tag 2: Full-Stack -->
    <rect x="350" y="175" width="250" height="30" rx="8" fill="#162032" stroke="#8A2BE2" stroke-width="1" stroke-opacity="0.5" />
    <text x="475" y="195" text-anchor="middle" fill="#C084FC">⚡ FULL-STACK &amp; CLOUD</text>

    <!-- Tag 3: AI Systems -->
    <rect x="615" y="175" width="225" height="30" rx="8" fill="#162032" stroke="#FF007F" stroke-width="1" stroke-opacity="0.4" />
    <text x="727" y="195" text-anchor="middle" fill="#FF77B4">🧠 AI SAAS BUILDER</text>
  </g>

  <!-- Tagline Quote -->
  <text x="475" y="240" text-anchor="middle" class="display" font-size="15" font-weight="400" fill="#94A3B8" letter-spacing="0.5">
    Engineering ultra-scalable automation bots, intelligent web platforms &amp; production-grade architectures.
  </text>

  <!-- Bottom Divider Line -->
  <line x1="45" y1="265" x2="905" y2="265" stroke="#334155" stroke-width="1" opacity="0.6" />

  <!-- Bottom Metrics Strip -->
  <g class="mono" font-size="12">
    <!-- Metric 1 -->
    <g transform="translate(60, 285)">
      <text x="0" y="16" fill="#00F0FF" font-size="16" font-weight="800">200+</text>
      <text x="50" y="16" fill="#64748B" font-size="11" font-weight="500">CLIENTS SERVED</text>
    </g>

    <!-- Divider -->
    <text x="235" y="301" fill="#334155">|</text>

    <!-- Metric 2 -->
    <g transform="translate(260, 285)">
      <text x="0" y="16" fill="#C084FC" font-size="16" font-weight="800">10K+</text>
      <text x="50" y="16" fill="#64748B" font-size="11" font-weight="500">ACTIVE BOT USERS</text>
    </g>

    <!-- Divider -->
    <text x="445" y="301" fill="#334155">|</text>

    <!-- Metric 3 -->
    <g transform="translate(470, 285)">
      <text x="0" y="16" fill="#00FF66" font-size="16" font-weight="800">99.9%</text>
      <text x="55" y="16" fill="#64748B" font-size="11" font-weight="500">SYSTEM UPTIME</text>
    </g>

    <!-- Divider -->
    <text x="660" y="301" fill="#334155">|</text>

    <!-- Metric 4 -->
    <g transform="translate(685, 285)">
      <text x="0" y="16" fill="#FF007F" font-size="16" font-weight="800">lectai.io</text>
      <text x="75" y="16" fill="#64748B" font-size="11" font-weight="500">FEATURED SAAS</text>
    </g>
  </g>

  <!-- Decorative HUD crosshairs -->
  <g stroke="#00F0FF" stroke-width="1" opacity="0.3">
    <line x1="475" y1="12" x2="475" y2="22" />
    <line x1="470" y1="17" x2="480" y2="17" />
    <line x1="475" y1="338" x2="475" y2="348" />
    <line x1="470" y1="343" x2="480" y2="343" />
  </g>
</svg>
